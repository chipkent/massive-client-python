name: unittest
on:
  push:
    tags:
      - v*
    branches:
      - v1
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} Unit test ${{ matrix.python-version }}
    steps:
      - name: Windows hack
        run: git config --system core.longpaths true
        if: ${{ matrix.os == 'windows-latest' }}
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Poetry
        uses: abatilo/actions-poetry@v2
      - name: Install pypi deps
        run: poetry install
      - name: Unit tests
        run: make test
  test-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13t', '3.14t']
    runs-on: ubuntu-latest
    name: ubuntu-latest Unit test ${{ matrix.python-version }} (PYTHON_GIL=0)
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Poetry
        # with the runner's own Python: some of Poetry's dependencies (e.g.
        # cryptography) don't build on free-threaded 3.13
        run: pipx install poetry
      - name: Install pypi deps
        # orjson, a dev dependency used only by the examples, does not support
        # free-threaded Python, so install the package and the test dependency
        # (pook) at their locked versions instead of `poetry install`
        run: |
          poetry env use python${{ matrix.python-version }}
          poetry install --only main
          poetry run python - > "$RUNNER_TEMP/constraints.txt" <<'EOF'
          import tomllib
          with open("poetry.lock", "rb") as f:
              for p in tomllib.load(f)["package"]:
                  print(f"{p['name']}=={p['version']}")
          EOF
          poetry run pip install pook -c "$RUNNER_TEMP/constraints.txt"
      - name: Unit tests
        env:
          PYTHON_GIL: '0'
        run: |
          poetry run python -c 'import sys; assert not sys._is_gil_enabled(), sys.version'
          make test
