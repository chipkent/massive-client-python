name: unittest
on:
  push:
    tags:
      - v*
    branches:
      - v1
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} Unit test ${{ matrix.python-version }}
    steps:
      - name: Windows hack
        run: git config --system core.longpaths true
        if: ${{ matrix.os == 'windows-latest' }}
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Poetry
        uses: abatilo/actions-poetry@v2
      - name: Install pypi deps
        run: poetry install
      - name: Unit tests
        run: make test
  test-free-threaded:
    runs-on: ubuntu-latest
    name: ubuntu-latest Unit test 3.14t (PYTHON_GIL=0)
    env:
      PYTHON_GIL: '0'
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
      - name: Install pypi deps
        # the tests need only the package and pook, not the dev tools
        run: pip install -e . pook
      - name: Check that the GIL is off
        run: python -c "import sys; assert not sys._is_gil_enabled(), sys.version"
      - name: Unit tests
        run: |
          python -m unittest discover -s test_rest
          python -m unittest discover -s test_websocket
